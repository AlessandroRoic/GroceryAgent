name: Project checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright install --only-shell chromium
      - run: pnpm run check

  pr-size:
    name: PR size
    permissions:
      contents: read
      pull-requests: read
      issues: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Read the linked issue estimate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue=$(jq -er '.pull_request.body | gsub("\r"; "") | capture("(?m)^## Primary issue[ \\t]*\\n\\s*#(?<id>[1-9][0-9]*)[ \\t]*$").id' "$GITHUB_EVENT_PATH") || { echo "::error::Enter #number under Primary issue in the PR template."; exit 1; }
          points=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/issue-field-values" --paginate --slurp |
            jq -er 'flatten | map(select(.issue_field_name == "Story points" and .data_type == "single_select")) | if length == 1 then .[0].single_select_option.name else empty end | select(. == "1" or . == "2" or . == "3" or . == "5")') || { echo "::error::Set the Story points field on issue #$issue to 1, 2, 3, or 5."; exit 1; }
          echo "STORY_POINTS=$points" >> "$GITHUB_ENV"
      - name: Check for repository owner size approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          approval=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate --slurp |
            jq -r --arg owner "$GITHUB_REPOSITORY_OWNER" --arg command "/approve-pr-size $PR_HEAD_SHA" '
              flatten | map(select(.user.login == $owner and .body == $command)) | last | .html_url // empty')
          echo "SIZE_APPROVAL_URL=$approval" >> "$GITHUB_ENV"
      - run: node scripts/check-pr-size.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
